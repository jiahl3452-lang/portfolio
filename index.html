<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>幻龙 · 作品集</title>
<meta name="description" content="幻龙的三维作品集：角色、生物资产、渲染镜头与制作过程。">
<style>
*{box-sizing:border-box}body{margin:0;background:#101211;color:#eceee8;font-family:Arial,"Microsoft YaHei",sans-serif}header,main,footer{max-width:1320px;margin:auto;padding:28px 6%}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #343731}a{color:inherit;text-decoration:none}.brand{font-size:23px;font-weight:700}.small{color:#a2a79e;font-size:12px;letter-spacing:2px}.intro{padding:72px 0 48px}.intro h1{font-size:clamp(46px,7vw,86px);letter-spacing:-3px;margin:16px 0 24px;font-weight:500}.intro p{color:#aeb4aa;line-height:1.9}.accent{color:#c6e58c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:38px 24px}.card{min-width:0}.card:first-child{grid-column:1/-1}.visual{background:#1c201c;border:1px solid #343a30;aspect-ratio:16/9;overflow:hidden}video{width:100%;height:100%;object-fit:contain;display:block}.meta{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0}.meta h2{font-size:19px;font-weight:500;margin:0}.tag{color:#a5b28f;font-size:12px}footer{margin-top:64px;border-top:1px solid #343731;color:#8b9385;font-size:13px;padding-top:26px;padding-bottom:40px}button{font:inherit}video:focus-visible,a:focus-visible{outline:2px solid #c6e58c}@media(max-width:650px){.grid{grid-template-columns:1fr;gap:20px}.intro{padding:42px 0 24px}.intro h1{letter-spacing:-1px}.small{font-size:10px;letter-spacing:1px}.meta h2{font-size:17px}}

nav{display:flex;gap:8px;margin:0 0 30px}nav button{padding:12px 25px;border:1px solid #41483b;background:transparent;color:#bfc6b7;cursor:pointer;border-radius:3px}nav button[aria-selected=true]{background:#c6e58c;color:#101211;border-color:#c6e58c}[hidden]{display:none!important}.stills{columns:2;column-gap:24px}.still{display:block;width:100%;padding:0;margin:0 0 24px;border:0;background:#1c201c;cursor:zoom-in;break-inside:avoid}.still img{display:block;width:100%;height:auto}.still span{display:block;color:#aeb4aa;text-align:left;padding:12px 15px;font-size:12px}dialog{border:0;padding:0;background:#101211;color:white;max-width:96vw;max-height:96vh}dialog::backdrop{background:#000e}dialog img{display:block;max-width:94vw;max-height:86vh;object-fit:contain}dialog button{display:block;margin:10px auto;padding:8px 20px;cursor:pointer}@media(max-width:650px){.stills{columns:1}}
.stills{columns:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}.character{background:#191d18;border:1px solid #343a30;min-width:0}.character summary{cursor:pointer;list-style:none}.character summary::-webkit-details-marker{display:none}.character summary>img{width:100%;height:300px;object-fit:contain;display:block;background:#111}.character summary>span{display:flex;justify-content:space-between;padding:18px;font-size:19px}.character small{font-size:12px;color:#a5b28f;font-weight:normal}.character-images{padding:12px}.character .still{margin-bottom:12px}.character[open]{grid-column:1/-1}.character[open] .character-images{columns:2;column-gap:12px}@media(max-width:650px){.stills{grid-template-columns:1fr}.character[open] .character-images{columns:1}.character summary>img{height:230px}}

.header-links{display:flex;align-items:center;gap:28px;font-size:13px;color:#b9c0b2}.hero{display:grid;grid-template-columns:43% 57%;align-items:center;padding:42px 0 44px;gap:0}.hero-copy{padding:28px 34px 28px 0;position:relative;z-index:1}.hero h1{font-size:clamp(38px,4.4vw,62px);line-height:1.22;letter-spacing:-2px;margin:25px 0}.hero .hero-role{font-size:16px;color:#e1e5db;margin:0 0 16px}.hero-role span{color:#606957;padding:0 10px}.hero .hero-description{font-size:14px;line-height:1.9;color:#949e8b;margin:0}.hero-actions{display:flex;gap:12px;margin-top:30px}.hero-actions a{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 18px;font-size:13px;border:1px solid #414b37}.hero-actions a:first-child{background:#c6e58c;color:#182010;border-color:#c6e58c}.hero-actions a:hover{filter:brightness(1.15)}.hero-note{margin-top:42px;font-size:10px;color:#8e9885;letter-spacing:1px;display:flex;justify-content:space-between;gap:12px}.hero-note>span{font-size:9px;letter-spacing:1.5px;color:#606b58}.hero-art{margin:0;position:relative;background:#191e1c;overflow:hidden;align-self:stretch;min-height:460px}.hero-art>img{height:100%;width:100%;object-fit:cover;object-position:49% center;position:absolute;inset:0}.hero-art:after{content:'';position:absolute;inset:65% 0 0;background:linear-gradient(transparent,#0d110fbb);pointer-events:none}.hero-art figcaption{position:absolute;bottom:20px;left:24px;right:24px;display:flex;justify-content:space-between;z-index:1;font-size:11px;letter-spacing:1px;color:#e0e7da}nav{border-top:1px solid #343731;padding-top:25px}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero-copy{padding:15px 0 30px}.hero-art{min-height:350px}.hero h1{font-size:48px}.hero-note{margin-top:26px}.header-links{gap:16px}.hero{padding-top:26px}.hero-art>img{object-position:center 40%}}@media(max-width:420px){.hero h1{font-size:40px}.hero-art{min-height:290px}.header-links .small{display:none}.brand{font-size:19px}}
</style>
<header><a class="brand" href="./">幻龙造物社<span class="accent">.</span></a><div class="header-links"><a href="#stills" data-hero-panel="stills">静帧作品</a><a href="#videos" data-hero-panel="videos">视频作品</a><span class="small">2026</span></div></header>
<main><section class="intro hero"><div class="hero-copy"><span class="small accent">CHARACTER &amp; CREATURE ART</span><h1>赋予想象<br>生命与形态<span class="accent">。</span></h1><p class="hero-role">幻龙 <span>/</span> 角色与生物艺术</p><p class="hero-description">从形体雕刻到材质与渲染，<br>探索角色的个性、生物的细节与真实感。</p><div class="hero-actions"><a href="#stills" data-hero-panel="stills">浏览静帧 <span>↗</span></a><a href="#videos" data-hero-panel="videos">观看作品合集 <span>▷</span></a></div><div class="hero-note">雕刻 / 材质 / 渲染 <span>SELECTED PORTFOLIO</span></div></div><figure class="hero-art"><img src="stills/021.jpg" alt="龙的三维角色成品展示"><figcaption><span>01 / 龙</span><span>CREATURE STUDY</span></figcaption></figure></section><nav aria-label="作品分类"><button aria-selected="true" data-panel="stills">静帧作品 · 93</button><button aria-selected="false" data-panel="videos">视频作品 · 6</button></nav><section id="stills" class="stills" aria-label="静帧作品"></section><section id="videos" hidden class="grid" aria-label="作品视频">
</section></main><footer>© 2026 幻龙 · 作品集 <span style="float:right">感谢观看</span></footer>
<dialog aria-label="作品大图"><img alt=""><button type="button">关闭 ×</button></dialog><script>
const panels=document.querySelectorAll('nav button');
function selectPanel(id){panels.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.panel===id)));['stills','videos'].forEach(p=>document.getElementById(p).hidden=p!==id);if(id==='stills')document.querySelectorAll('video').forEach(v=>v.pause());}
document.querySelectorAll('[data-hero-panel]').forEach(a=>a.onclick=()=>selectPanel(a.dataset.heroPanel));
panels.forEach(b=>b.onclick=()=>{selectPanel(b.dataset.panel);history.replaceState(null,'','#'+b.dataset.panel)});if(location.hash==='#videos')selectPanel('videos');
const lightbox=document.querySelector('dialog');lightbox.querySelector('button').onclick=()=>lightbox.close();lightbox.onclick=e=>{if(e.target===lightbox)lightbox.close()};
fetch('stills.json').then(r=>r.json()).then(items=>{const groups=Object.groupBy(items,item=>item.group);document.getElementById('stills').innerHTML=Object.entries(groups).map(([name,images])=>{const cover=images.find(i=>!i.name.includes('_h')&&!i.name.includes('hb'))||images[0];return `<details class="character"><summary><img loading="lazy" src="thumbs/${cover.id}.jpg" alt="${name}"><span>${name}<small>${images.length} 张 · 点击展开</small></span></summary><div class="character-images">${images.map(item=>`<button class="still" data-id="${item.id}" aria-label="放大 ${item.name}"><img loading="lazy" decoding="async" src="thumbs/${item.id}.jpg" width="${item.width}" height="${item.height}" alt="${item.name}"><span>${item.name}</span></button>`).join('')}</div></details>`}).join('');document.querySelectorAll('.still').forEach(b=>b.onclick=()=>{const img=lightbox.querySelector('img');img.src='stills/'+b.dataset.id+'.jpg';img.alt=b.getAttribute('aria-label').replace('放大 ','');lightbox.showModal()})});
const works=[['showreel','作品合集','精选作品'],['assets','资产演示合集','资产展示'],['lizard-render','蜥蜴 · 渲染镜头','生物资产'],['lizard-process','蜥蜴 · 制作演示','制作过程'],['portrait','头像演示','角色展示'],['toad','Toad 演示','生物展示']];
document.querySelector('.grid').innerHTML=works.map(([id,title,tag],i)=>`<article class="card"><div class="visual"><video controls playsinline preload="none" poster="posters/${id}.jpg?v=2" aria-label="${title}"><source src="media/${id}.mp4" type="video/mp4">浏览器无法播放此视频，请<a href="media/${id}.mp4">下载观看</a>。</video></div><div class="meta"><h2>${title}</h2><span class="tag">0${i+1} / ${tag}</span></div></article>`).join('');
document.querySelectorAll('video').forEach(v=>v.addEventListener('play',()=>document.querySelectorAll('video').forEach(other=>{if(other!==v)other.pause()})));
</script></html>
